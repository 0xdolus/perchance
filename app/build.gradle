plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def ksEnv = System.getenv("KEYSTORE_PATH")
def hasReleaseKey = ksEnv != null && file(ksEnv).length() > 0 && System.getenv("KEY_ALIAS")

android {
    namespace "com.perchance.shell"
    compileSdk 34

    defaultConfig {
        applicationId "com.perchance.shell"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (hasReleaseKey) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASS")
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.8.0'
}
